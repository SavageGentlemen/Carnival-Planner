name: Daily Autonomous Pixel RAG Scraper

on:
  schedule:
    - cron: '0 4 * * *' # Every day at 04:00 UTC
  workflow_dispatch:     # Allows manual trigger button from GitHub Actions tab

permissions:
  contents: write

jobs:
  pixel-scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Google Chrome (Headless)
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor -o /usr/share/keyrings/google-chrome.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow google-generativeai firebase-admin requests

      - name: Run Pixel RAG Autonomous Scraper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          python3 scripts/pixel_rag_scraper.py --targets scripts/pixel_targets.json --sync-firestore

      - name: Commit and Push Updated Event & Package Data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add events.json scripts/extracted_carnival_data.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes detected in events.json."
          else
            git commit -m "chore(data): autonomous daily Pixel RAG sync [skip ci]"
            git push
            echo "Successfully pushed refreshed events data to repository."
          fi

      - name: Post Job Summary
        run: |
          echo "### 📸 Pixel RAG Daily Run Complete" >> $GITHUB_STEP_SUMMARY
          echo "Run completed at: $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "- Updated events directory: \`events.json\`" >> $GITHUB_STEP_SUMMARY
          echo "- Target catalog: \`scripts/pixel_targets.json\`" >> $GITHUB_STEP_SUMMARY
