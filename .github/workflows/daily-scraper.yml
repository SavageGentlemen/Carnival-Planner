name: Daily Carnival Event Scraper

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: functions2/package-lock.json

      - name: Install dependencies
        run: |
          cd functions2
          npm install --legacy-peer-deps

      - name: Run Carnival Event Scraper & Scarcity Sentinel
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cd functions2
          node -e "const { runStandalone } = require('./scraper'); runStandalone().then(() => process.exit(0)).catch(err => { console.error(err); process.exit(1); });"

      - name: Log completion
        run: echo "Autonomous Scraper Sentinel completed at $(date)"
