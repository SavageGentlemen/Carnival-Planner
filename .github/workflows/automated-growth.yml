name: Automated Growth Engine (SEO, Flight Tracker & Faceless Video)

on:
  schedule:
    - cron: '0 5 * * *' # Executes daily at 05:00 UTC
  workflow_dispatch:

jobs:
  growth-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements-growth.txt

      - name: Run Autonomous SEO Content Studio
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          python scripts/seo_builder.py

      - name: Run Flight Price Aggregation & Alert Engine
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          python scripts/flight_aggregator.py

      - name: Run Faceless Video Distribution Engine
        run: |
          python scripts/video_generator.py

      - name: Run YouTube Shorts Auto-Publisher
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python scripts/youtube_uploader.py

      - name: Commit and Push Updated Data to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "auto(growth): update daily SEO articles & flight price deals"
            git push
          fi
