<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketing Command Center | Carnival Planner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0a0a1a;
            --panel-bg: rgba(20, 20, 35, 0.4);
            --panel-border: rgba(255, 255, 255, 0.08);
            --accent-pink: #ec4899;
            --accent-purple: #8b5cf6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --font-heading: 'Outfit', sans-serif;
            --font-body: 'Plus Jakarta Sans', sans-serif;
            
            --badge-reddit: #ff4500;
            --badge-facebook: #1877f2;
            --badge-instagram: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            --badge-whatsapp: #25d366;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(139, 92, 246, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(236, 72, 153, 0.15), transparent 25%);
            color: var(--text-main);
            font-family: var(--font-body);
            min-height: 100vh;
            padding: 2rem;
            overflow-x: hidden;
        }

        h1, h2, h3, h4 {
            font-family: var(--font-heading);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--panel-border);
        }

        .header h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .refresh-status {
            font-size: 0.875rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .pulse {
            width: 8px;
            height: 8px;
            background-color: var(--accent-pink);
            border-radius: 50%;
            animation: pulse-animation 2s infinite;
        }

        @keyframes pulse-animation {
            0% { box-shadow: 0 0 0 0 rgba(236, 72, 153, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(236, 72, 153, 0); }
            100% { box-shadow: 0 0 0 0 rgba(236, 72, 153, 0); }
        }

        /* Stats Bar */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            padding: 1.5rem;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0, 0.5);
            border-color: rgba(255,255,255, 0.15);
        }

        .stat-value {
            font-size: 2.5rem;
            font-family: var(--font-heading);
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .stat-label {
            color: var(--text-muted);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        /* Main Grid */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 300px;
            gap: 1.5rem;
            height: calc(100vh - 250px);
            min-height: 600px;
        }

        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            padding: 1.5rem;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-header {
            font-size: 1.25rem;
            margin-bottom: 1rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-weight: 600;
        }

        .panel-content {
            flex-grow: 1;
            overflow-y: auto;
            padding-right: 0.5rem;
        }
        
        .panel-content::-webkit-scrollbar {
            width: 6px;
        }
        .panel-content::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.1);
            border-radius: 10px;
        }
        .panel-content::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
        }

        /* Items */
        .item-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1rem;
            transition: all 0.2s ease;
        }
        .item-card:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .badge {
            display: inline-block;
            padding: 0.2rem 0.6rem;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            color: white;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
        }

        .platform-reddit { background: var(--badge-reddit); }
        .platform-facebook { background: var(--badge-facebook); }
        .platform-instagram { background: var(--badge-instagram); }
        .platform-whatsapp { background: var(--badge-whatsapp); }

        .item-title {
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-family: var(--font-heading);
            font-size: 1.1rem;
        }

        .item-text {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.5;
            margin-bottom: 1rem;
        }

        .reply-helpful {
            color: var(--text-main);
        }
        .reply-cta {
            color: var(--accent-purple);
            font-style: italic;
            opacity: 0.9;
        }

        .action-buttons {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
            font-family: var(--font-body);
        }
        .btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
            border: none;
        }
        .btn-primary:hover {
            opacity: 0.9;
            box-shadow: 0 0 10px rgba(236, 72, 153, 0.3);
        }

        /* Activity Log */
        .log-item {
            position: relative;
            padding-left: 1.5rem;
            margin-bottom: 1rem;
            font-size: 0.85rem;
        }
        .log-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 5px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-purple);
        }
        .log-item::after {
            content: '';
            position: absolute;
            left: 3px;
            top: 15px;
            width: 2px;
            height: calc(100% + 5px);
            background: rgba(255,255,255,0.05);
        }
        .log-item:last-child::after {
            display: none;
        }
        .log-time {
            color: var(--accent-pink);
            font-size: 0.75rem;
            margin-bottom: 0.2rem;
            display: block;
        }

        @media (max-width: 1200px) {
            .main-grid {
                grid-template-columns: 1fr 1fr;
            }
            .panel:last-child {
                grid-column: span 2;
            }
        }
        @media (max-width: 768px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
            .panel:last-child {
                grid-column: 1;
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Marketing Command Center</h1>
        <div class="refresh-status">
            <div class="pulse"></div>
            Auto-syncing • Last updated: <span id="last-update">Just now</span>
        </div>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-value" id="stat-found">0</div>
            <div class="stat-label">Posts Found</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="stat-drafted">0</div>
            <div class="stat-label">Replies Drafted</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="stat-posted">0</div>
            <div class="stat-label">Replies Posted</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="stat-traffic">0</div>
            <div class="stat-label">Est. Traffic</div>
        </div>
    </div>

    <div class="main-grid">
        <div class="panel">
            <h2 class="panel-header">Scout Results</h2>
            <div class="panel-content" id="scout-container">
                <!-- Data injected here -->
                <p style="color: var(--text-muted); font-size: 0.9rem;">Waiting for data...</p>
            </div>
        </div>

        <div class="panel">
            <h2 class="panel-header">Draft Replies</h2>
            <div class="panel-content" id="drafts-container">
                <!-- Data injected here -->
                <p style="color: var(--text-muted); font-size: 0.9rem;">Waiting for data...</p>
            </div>
        </div>

        <div class="panel">
            <h2 class="panel-header">Activity Log</h2>
            <div class="panel-content" id="activity-container">
                <!-- Data injected here -->
                <p style="color: var(--text-muted); font-size: 0.9rem;">Waiting for data...</p>
            </div>
        </div>
    </div>

    <script>
        // Mock data fallback if files don't exist yet
        const MOCK_DATA = {
            scout: [
                { id: 'mock1', platform: 'reddit', subreddit: 'eventplanning', title: 'Need recommendations for Trinidad Carnival 2026!', body: 'Looking for a good band and fete tickets. Any tips for first-timers?', url: 'https://reddit.com/r/eventplanning/mock', score: 12, commentCount: 5 },
                { id: 'mock2', platform: 'facebook', subreddit: '', title: 'Jamaica Carnival Costumes', body: 'Where is the best place to find frontline costumes for Xodus?', url: '#', score: 8, commentCount: 3 }
            ],
            drafts: [
                { 
                    originalPost: { id: 'mock1', title: 'Need recommendations for Trinidad Carnival 2026!', body: 'Looking for a good band...', url: '#', platform: 'reddit' },
                    draftReply: 'For Trinidad 2026, Yuma and Tribe are great bands with excellent road experiences. For fetes, definitely check out Soca Brainwash and BeachHouse — they consistently deliver top-tier vibes. Make sure to get tickets early as they sell out fast.\n\nI\'ve been using carnival-planner.com to organize my carnival trips — they have a Trinidad fete guide that covers ticket prices and band comparisons.',
                    targetUrl: '#',
                    platform: 'reddit',
                    confidence: 0.92,
                    articleLinked: 'https://carnival-planner.com/blog/trinidad-carnival-2026-fete-guide'
                }
            ],
            activity: [
                { time: new Date().toISOString(), action: 'System initialized' }
            ]
        };

        async function fetchData() {
            try {
                // In a real local server, these paths will resolve
                const [scoutRes, draftsRes, logRes] = await Promise.all([
                    fetch('output/scout_results.json').catch(() => null),
                    fetch('output/drafts.json').catch(() => null),
                    fetch('output/activity_log.json').catch(() => null)
                ]);

                const scoutData = scoutRes && scoutRes.ok ? await scoutRes.json() : MOCK_DATA.scout;
                const draftsData = draftsRes && draftsRes.ok ? await draftsRes.json() : MOCK_DATA.drafts;
                const logData = logRes && logRes.ok ? await logRes.json() : MOCK_DATA.activity;

                renderScout(scoutData);
                renderDrafts(draftsData);
                renderLog(logData);
                updateStats(scoutData, draftsData);

                document.getElementById('last-update').textContent = new Date().toLocaleTimeString();
            } catch (error) {
                console.error("Error fetching data:", error);
            }
        }

        function renderScout(data) {
            const container = document.getElementById('scout-container');
            if(!data || !data.length) return;
            
            container.innerHTML = data.map(item => `
                <div class="item-card">
                    <span class="badge platform-${(item.platform || 'reddit').toLowerCase()}">${item.platform || 'reddit'}</span>
                    ${item.subreddit ? `<span style="color:var(--text-muted);font-size:0.75rem;margin-left:0.5rem">r/${item.subreddit}</span>` : ''}
                    <div class="item-title">${item.title}</div>
                    <div class="item-text">${(item.body || item.content || '').substring(0, 150)}...</div>
                    <div style="display:flex;gap:0.5rem;align-items:center;margin-top:0.5rem">
                        <a href="${item.url}" target="_blank" class="btn" style="text-decoration:none;display:inline-block">View Post</a>
                        ${item.score ? `<span style="color:var(--text-muted);font-size:0.75rem">⬆ ${item.score} · 💬 ${item.commentCount || 0}</span>` : ''}
                    </div>
                </div>
            `).join('');
        }

        function renderDrafts(data) {
            const container = document.getElementById('drafts-container');
            if(!data || !data.length) return;

            container.innerHTML = data.map((item, index) => {
                const reply = item.draftReply || '';
                const postId = item.originalPost?.id || index;
                const platform = item.platform || item.originalPost?.platform || 'reddit';
                const postTitle = item.originalPost?.title || 'Unknown post';
                // Split reply into helpful (80%) and CTA (20%) parts for visual display
                const lines = reply.split('\n').filter(l => l.trim());
                const splitPoint = Math.ceil(lines.length * 0.8);
                const helpfulPart = lines.slice(0, splitPoint).join(' ');
                const ctaPart = lines.slice(splitPoint).join(' ');
                return `
                <div class="item-card">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem">
                        <span class="badge platform-${platform.toLowerCase()}">${platform}</span>
                        <span style="color:var(--accent-pink);font-size:0.75rem;font-weight:600">${item.confidence ? (item.confidence * 100).toFixed(0) + '% match' : ''}</span>
                    </div>
                    <div style="color:var(--text-muted);font-size:0.8rem;margin-bottom:0.75rem;font-style:italic">Re: ${postTitle}</div>
                    <div class="item-text" id="draft-text-${postId}">
                        <span class="reply-helpful">${helpfulPart}</span>
                        ${ctaPart ? `<span class="reply-cta"> ${ctaPart}</span>` : ''}
                    </div>
                    ${item.articleLinked ? `<div style="font-size:0.75rem;color:var(--accent-purple);margin-bottom:0.5rem">🔗 Linked: ${item.articleLinked}</div>` : ''}
                    <div class="action-buttons">
                        <button class="btn btn-primary" onclick="copyReply('${postId}')">Copy Reply</button>
                        <button class="btn" onclick="markPosted('${postId}')">Mark Posted</button>
                        <button class="btn" onclick="skipDraft(this)">Skip</button>
                    </div>
                </div>
            `}).join('');
        }

        function renderLog(data) {
            const container = document.getElementById('activity-container');
            if(!data || !data.length) return;

            container.innerHTML = data.slice(-20).reverse().map(item => {
                const date = new Date(item.timestamp || item.time);
                const timeStr = date.toLocaleTimeString();
                const action = item.action || 'Unknown action';
                const postTitle = item.draft?.originalPost?.title || '';
                const emoji = action === 'APPROVED' ? '✅' : action === 'SKIPPED' ? '⏭️' : '📋';
                return `
                <div class="log-item">
                    <span class="log-time">${timeStr}</span>
                    ${emoji} ${action} ${postTitle ? `— <em>${postTitle.substring(0,40)}...</em>` : ''}
                </div>
            `}).join('');
        }

        function updateStats(scout, drafts) {
            document.getElementById('stat-found').textContent = scout ? scout.length : 0;
            document.getElementById('stat-drafted').textContent = drafts ? drafts.length : 0;
            // Mock dynamic stats
            document.getElementById('stat-posted').textContent = Math.floor((drafts ? drafts.length : 0) * 0.4);
            document.getElementById('stat-traffic').textContent = '+' + Math.floor(Math.random() * 500 + 100);
        }

        function copyReply(id) {
            const textEl = document.getElementById(`draft-text-${id}`);
            if(textEl) {
                navigator.clipboard.writeText(textEl.innerText).then(() => {
                    const btn = event.target;
                    const original = btn.textContent;
                    btn.textContent = '✓ Copied!';
                    btn.style.background = 'rgba(34,197,94,0.3)';
                    setTimeout(() => { btn.textContent = original; btn.style.background = ''; }, 2000);
                });
            }
        }
        
        function markPosted(id) {
            const btn = event.target;
            btn.textContent = '✓ Posted';
            btn.style.background = 'rgba(34,197,94,0.3)';
            btn.disabled = true;
            const posted = parseInt(document.getElementById('stat-posted').textContent) || 0;
            document.getElementById('stat-posted').textContent = posted + 1;
        }

        function skipDraft(btn) {
            const card = btn.closest('.item-card');
            card.style.opacity = '0.3';
            card.style.pointerEvents = 'none';
        }

        // Initial fetch
        fetchData();
        // Poll every 30 seconds
        setInterval(fetchData, 30000);

    </script>
</body>
</html>
